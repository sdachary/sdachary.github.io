name: Standard CI (Node.js)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      install-cmd:
        type: string
        default: 'npm ci'
      lint-cmd:
        type: string
        default: 'npm run lint'
      typecheck-cmd:
        type: string
        default: 'npx tsc --noEmit'
      test-cmd:
        type: string
        default: 'npm test'
      build-cmd:
        type: string
        default: ''
      build-env:
        type: string
        default: '{}'
      deploy-cmd:
        type: string
        default: ''
      gitleaks-npx:
        type: boolean
        default: false
      # Production dependencies only: dev-chain advisories (vite/wrangler/miniflare)
      # must never block a deploy, but a high+ in a shipped dependency must.
      audit-cmd:
        type: string
        default: 'npm audit --omit=dev --audit-level=high'

# NOTE: no top-level `concurrency:` here — it is invalid on a `workflow_call`-only
# reusable workflow and GitHub rejects the run with "workflow file issue" (no jobs
# created). Concurrency is enforced by each caller workflow's own top-level block.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: ${{ inputs.install-cmd }}

      - if: ${{ inputs.audit-cmd != '' }}
        name: Dependency audit (prod, high+)
        run: ${{ inputs.audit-cmd }}

      - if: ${{ !inputs.gitleaks-npx }}
        name: Gitleaks
        run: docker run -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:latest detect -c /repo/.gitleaks.toml -s /repo
        continue-on-error: true

      - if: ${{ inputs.gitleaks-npx }}
        name: Gitleaks
        run: npx gitleaks@latest detect
        continue-on-error: true

      - if: ${{ inputs.lint-cmd != '' }}
        run: ${{ inputs.lint-cmd }}

      - if: ${{ inputs.typecheck-cmd != '' }}
        run: ${{ inputs.typecheck-cmd }}

      - if: ${{ inputs.test-cmd != '' }}
        run: ${{ inputs.test-cmd }}

      - if: ${{ inputs.build-cmd != '' }}
        run: ${{ inputs.build-cmd }}
        env: ${{ fromJSON(inputs.build-env) }}

      - if: ${{ inputs.deploy-cmd != '' && github.event_name == 'push' }}
        run: ${{ inputs.deploy-cmd }}
