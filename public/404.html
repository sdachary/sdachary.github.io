<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2ea" />
    <title>Page not found — S Deepak Achary</title>
    <meta name="description" content="That path doesn't exist. Head back to the portfolio." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Geist:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f7f4ee;
        --bg2: #efe9df;
        --ink: #17140f;
        --muted: #57503f;
        --accent: #7a5f42;
        --line: rgba(23,20,15,0.14);
        --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
        --font-body: 'Geist', system-ui, -apple-system, sans-serif;
        --font-mono: 'DM Mono', ui-monospace, monospace;
        --ease-smooth: cubic-bezier(0.32, 0.72, 0, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        padding: clamp(1.5rem, 6vw, 5rem);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
        opacity: 0.01;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1.5rem;
      }
      .code {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(6rem, 22vw, 15rem);
        line-height: 0.85;
        letter-spacing: -0.04em;
        color: transparent;
        -webkit-text-stroke: 2px var(--accent);
        user-select: none;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 1.5rem 0 0.9rem;
        text-wrap: balance;
      }
      p {
        color: var(--muted);
        font-size: clamp(0.95rem, 1.6vw, 1.1rem);
        line-height: 1.7;
        max-width: 46ch;
        text-wrap: pretty;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 2.5rem;
      }
      a {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.7rem 1.2rem;
        border: 1px solid var(--line);
        border-radius: 100px;
        color: var(--muted);
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        transition: color 0.3s var(--ease-smooth), border-color 0.3s var(--ease-smooth), background 0.3s var(--ease-smooth);
      }
      a:hover { color: var(--accent); border-color: var(--accent); background: var(--bg2); }
      a:active { transform: scale(0.98); }
      a.primary { background: var(--accent); border-color: var(--accent); color: #fdfbf6; }
      a.primary:hover { background: #8e7050; color: #fdfbf6; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
      footer {
        margin-top: clamp(3rem, 8vw, 5rem);
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Error 404</div>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>The link may be stale, or the path was mistyped. Everything lives on the main site.</p>
      <nav aria-label="Recovery links">
        <a class="primary" href="/">Back to home</a>
        <a href="/#projects">Projects</a>
        <a href="/#blog">Blog</a>
        <a href="/#contact">Contact</a>
      </nav>
      <footer>S Deepak Achary — Hyderabad, India</footer>
    </main>
  </body>
</html>
